<title>연구행정 지원 플랫폼</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: 네이비 브랜드 사이드바(로고·주 메뉴) + 밑줄형 업무 탭 + 하위 메뉴 + 작업 영역. 색은 Carnot 로고의 네이비·크림·오렌지 */
:root{
  --bg:#F2F1ED;--panel:#FFFFFF;--sunk:#F6F5F1;--line:#E2DFD6;--fg:#14203F;--muted:#5E6782;
  --brand:#0B1D47;--brand-2:#16295A;--cream:#F4EFE4;--cream-dim:rgba(244,239,228,.66);
  --accent:#1C3577;--accent-fg:#FFFFFF;--orange:#E8820C;--orange-soft:#FDEBD5;--orange-ink:#9A4F00;
  --good:#1E7A4C;--good-bg:#E0F2E7;--bad:#B3352A;--bad-bg:#FBE5E2;--warn:#93560A;--warn-bg:#FCEFD9;--info-bg:#E5EAF6;--mute-bg:#ECEAE4;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09122B;--panel:#0F1A3A;--sunk:#0C1632;--line:#23325C;--fg:#ECE8DE;--muted:#9AA4C0;
  --brand:#060E26;--brand-2:#14224A;--accent:#F4EFE4;--accent-fg:#0B1D47;--orange:#F39A35;--orange-soft:#3B2913;--orange-ink:#F6B66A;
  --good:#71D3A0;--good-bg:#143628;--bad:#F2958B;--bad-bg:#43201D;--warn:#F0B95E;--warn-bg:#3A2D14;--info-bg:#182750;--mute-bg:#1A264A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09122B;--panel:#0F1A3A;--sunk:#0C1632;--line:#23325C;--fg:#ECE8DE;--muted:#9AA4C0;
  --brand:#060E26;--brand-2:#14224A;--accent:#F4EFE4;--accent-fg:#0B1D47;--orange:#F39A35;--orange-soft:#3B2913;--orange-ink:#F6B66A;
  --good:#71D3A0;--good-bg:#143628;--bad:#F2958B;--bad-bg:#43201D;--warn:#F0B95E;--warn-bg:#3A2D14;--info-bg:#182750;--mute-bg:#1A264A;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.55 var(--font);word-break:keep-all;overflow-wrap:anywhere}
#root{min-height:100%;display:flex;flex-direction:column}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}.small{font-size:12.5px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.demo{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--orange-soft);color:var(--orange-ink);font-size:12.5px}
.demo b{font-weight:600}
.path{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center;list-style:none;margin:0;padding:0}
.path button{border:0;background:none;padding:2px 6px;border-radius:4px;font-size:12.5px;color:inherit;text-decoration:underline;text-underline-offset:3px;text-decoration-color:transparent}
.path button:hover{text-decoration-color:currentColor}
.path li+li::before{content:"›";margin-right:2px;opacity:.6}
.viewas{display:flex;gap:6px;align-items:center;white-space:nowrap}
.viewas select{padding:2px 6px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--fg);max-width:210px;white-space:normal}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);flex:1}
.side{background:var(--brand);color:var(--cream);padding:22px 0 20px;display:flex;flex-direction:column;gap:22px}
.logo{padding:0 22px}
.logo img{display:block;width:132px;height:auto}
.org{margin:0 14px;padding:12px;background:var(--brand-2);border-radius:8px;display:flex;gap:10px;align-items:center}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--cream);color:#0B1D47;display:grid;place-items:center;font-weight:700;flex:none}
.org strong{display:block;font-size:13px;line-height:1.35}
.org span{font-size:12px;color:var(--cream-dim)}
.menu{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.menu .lab{font-size:11px;letter-spacing:.08em;color:var(--cream-dim);padding:10px 12px 4px}
.menu button{border:0;background:none;color:var(--cream-dim);padding:9px 12px;border-radius:6px;text-align:left;display:flex;align-items:center;gap:10px;font-size:14px}
.menu button::before{content:"";width:6px;height:6px;border-radius:50%;background:transparent;flex:none}
.menu button:hover{color:var(--cream);background:rgba(255,255,255,.05)}
.menu button[aria-current="true"]{color:var(--cream);background:var(--brand-2);font-weight:600}
.menu button[aria-current="true"]::before{background:var(--orange)}
.menu .soon{margin-left:auto;font-size:11px;padding:0 6px;border:1px solid rgba(244,239,228,.3);border-radius:10px}
.main{min-width:0;display:flex;flex-direction:column}
.top{background:var(--panel);border-bottom:1px solid var(--line);padding-top:16px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top h1{font-size:20px}
.top .crumb{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:12px}
.tabs button{border:0;background:none;padding:9px 14px 11px;white-space:nowrap;font-size:14px;color:var(--muted);border-bottom:3px solid transparent}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-current="true"]{color:var(--fg);font-weight:600;border-bottom-color:var(--orange)}
.tabs .ptab{display:flex;align-items:center;flex:none;border-bottom:3px solid transparent}
.tabs .ptab.on{border-bottom-color:var(--orange)}
.tabs .ptab button[data-a="tab"]{border-bottom:0;padding-right:2px}
.tabs .ptab .tx{border:0;background:none;padding:2px 7px;margin:0 4px 2px 0;font-size:16px;line-height:1;color:var(--muted);border-radius:5px}
.tabs .ptab .tx:hover{background:var(--sunk);color:var(--fg)}
.tabs .tabopen{flex:none;display:flex;align-items:center}
.tabs .tabopen select{width:auto;border:1px dashed var(--line);background:transparent;color:var(--muted);font-size:13px;padding:5px 8px;margin:0 0 4px 6px;border-radius:7px}
.teamf{margin:-4px 0 14px;flex-wrap:wrap}
.tabs .tsep{width:1px;background:var(--line);margin:8px 6px 10px;flex:none}
.body{flex:1;display:grid;grid-template-columns:168px minmax(0,1fr)}
.body.single{grid-template-columns:minmax(0,1fr)}
.subnav{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:1px;padding:14px 8px}
.subnav .lab{font-size:11px;letter-spacing:.08em;color:var(--muted);padding:10px 10px 4px}
.subnav button{border:0;background:none;padding:7px 10px;font-size:13.5px;text-align:left;border-radius:6px;color:var(--fg)}
.subnav button:hover{background:var(--sunk)}
.subnav button[aria-current="true"]{background:var(--info-bg);font-weight:600}
.work{padding-block:22px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:18px}
.body:not(.single) .work{padding-left:24px}
.page-head{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between}
.page-head h2{font-size:18px}
.page-head p{margin-top:2px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:4px}
.pcard:hover{border-color:var(--accent)}
.pcard h3{font-size:15px;margin-bottom:8px}
.kv{display:grid;grid-template-columns:58px minmax(0,1fr);gap:2px 10px;font-size:12.5px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.addcard{border:1.5px dashed var(--line);background:none;border-radius:10px;min-height:190px;font-size:16px;color:var(--muted)}
.addcard:hover{border-color:var(--orange);color:var(--orange-ink)}
.meter{height:6px;background:var(--mute-bg);margin-top:10px;border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.notice{padding:10px 14px;background:var(--info-bg);border-radius:8px;font-size:13px}
.notice.warn{background:var(--warn-bg)}.notice.bad{background:var(--bad-bg)}.notice.good{background:var(--good-bg)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;font-size:12px;border-radius:10px;background:var(--mute-bg);white-space:nowrap;line-height:1.6}
.chip.good{background:var(--good-bg);color:var(--good)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.info{background:var(--info-bg)}.chip.org{background:var(--orange-soft);color:var(--orange-ink)}
.h3{font-size:15px;margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stats span{display:block;font-size:12.5px;color:var(--muted)}
.stats strong{font-size:19px;font-variant-numeric:tabular-nums}
.stats .bad strong{color:var(--bad)}

.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:600;text-align:left;background:var(--sunk);padding:8px 10px;white-space:nowrap;color:var(--muted);font-size:12.5px}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tfoot td{font-weight:600;border-top:2px solid var(--line)}
tr.new td{background:var(--orange-soft)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px;text-align:left}
:root[data-theme="dark"] .linkbtn{color:var(--fg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .linkbtn{color:var(--fg)}}
.mini{display:inline-block;width:64px;height:6px;background:var(--mute-bg);border-radius:3px;vertical-align:middle;margin-right:6px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--accent)}
.ox{display:flex;flex-wrap:wrap;gap:4px}
.oxb{border:0;border-radius:4px;padding:1px 7px;font-size:12px;white-space:nowrap;display:inline-flex;gap:5px;align-items:center}
.oxb b{font-weight:700}
.oxb.O{background:var(--good-bg);color:var(--good)}.oxb.X{background:var(--bad-bg);color:var(--bad)}.oxb.N{background:var(--mute-bg);color:var(--muted)}.oxb.P{background:var(--warn-bg);color:var(--warn)}
.src{font-size:11px;padding:0 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;font-style:normal}
.src.form{border-color:var(--accent);color:var(--accent)}.src.approval{border-color:var(--orange);color:var(--orange-ink)}.src.card{border-color:var(--good);color:var(--good)}
:root[data-theme="dark"] .src.form{color:var(--fg);border-color:var(--fg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .src.form{color:var(--fg);border-color:var(--fg)}}

.btn{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.primary:hover{filter:brightness(1.15)}
.btn.warm{background:var(--orange);border-color:var(--orange);color:#1A1205;font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 10px;font-size:12.5px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12.5px;font-weight:500}
.field small{color:var(--muted);font-size:12px}
input[type=text],input[type=password],input[type=email],input[type=number],input[type=date],input[type=time],select,textarea{border:1px solid var(--line);background:var(--panel);padding:7px 9px;border-radius:6px;width:100%;min-width:0}
input[type=file]{font-size:12.5px;max-width:100%}
textarea{resize:vertical;line-height:1.6}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.check{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;background:var(--sunk);border-radius:6px}
.check input{margin-top:4px;flex:none}
.check.conf{background:var(--bad-bg)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px}
.err{color:var(--bad);font-size:13px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:var(--panel);padding:5px 12px;border-radius:16px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.evlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.evrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:9px 10px;border-top:1px solid var(--line)}
.evrow:first-child{border-top:0}
.evrow .nm{font-size:13px;display:flex;flex-direction:column;gap:2px}
.evrow .nm small{color:var(--muted);font-size:12px}
.evrow .ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tog{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tog button{border:0;background:var(--panel);padding:2px 10px;font-weight:700;font-size:12.5px;color:var(--muted)}
.tog button+button{border-left:1px solid var(--line)}
.tog button[aria-pressed="true"].X{background:var(--bad-bg);color:var(--bad)}
.tog button[aria-pressed="true"].N{background:var(--mute-bg);color:var(--fg)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.fname{font-size:12px;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.steps{display:flex;flex-wrap:wrap;list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.steps li{flex:1 1 130px;padding:8px 12px;font-size:13px;color:var(--muted)}
.steps li+li{border-left:1px solid var(--line)}
.steps li.on{background:var(--orange-soft);color:var(--orange-ink);font-weight:600}
.steps li.done{color:var(--good)}
.draftgrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px}
.sources{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:9px;font-size:13px;align-self:start;max-height:560px;overflow-y:auto}
.sources ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.sources b{color:var(--orange-ink)}
.ledger{display:grid;grid-template-columns:1fr auto;gap:4px 18px;max-width:380px}
.ledger .tot{font-weight:700;border-top:1px solid var(--line);padding-top:4px}

.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:10px;border-radius:3px;display:inline-block}
.sw.st-plan,.mt.st-plan,.pill.st-plan{background:var(--orange-soft);border:1.5px dashed var(--orange)}
.sw.st-done,.mt.st-done,.pill.st-done{background:var(--accent);border:1.5px solid var(--accent);color:var(--accent-fg)}
.sw.st-late,.mt.st-late,.pill.st-late{background:var(--bad-bg);border:1.5px dashed var(--bad)}
.calwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(96px,1fr));min-width:690px}
.cal .dow{padding:7px 8px;font-size:12px;color:var(--muted);background:var(--sunk);border-bottom:1px solid var(--line)}
.cal .day{min-height:104px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:5px;display:flex;flex-direction:column;gap:3px}
.cal .day:nth-child(7n+1){border-left:0}
.cal .day.out{background:var(--sunk)}
.cal .day.out .dn{opacity:.4}
.cal .dn{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cal .day.today .dn{color:var(--orange-ink);font-weight:700}
.mt{border-radius:5px;padding:3px 6px;font-size:11.5px;line-height:1.35;text-align:left;width:100%;color:var(--fg);display:flex;flex-direction:column;gap:1px}
.mt span{display:block}
.mt b{font-weight:600}
.mt.st-done b,.mt.st-done{color:var(--accent-fg)}
.mt.ev-mtg{background:var(--info-bg)}.mt.ev-ws{background:var(--good-bg)}.mt.ev-due{background:var(--warn-bg)}.mt.ev-eval{background:var(--bad-bg)}.mt.ev-etc{background:var(--mute-bg)}
.mt.ev-mtg b{color:var(--accent)}.mt.ev-ws b{color:var(--good)}.mt.ev-due b{color:var(--warn)}.mt.ev-eval b{color:var(--bad)}
.rate-over{color:var(--bad);font-weight:700}

.pill{border-radius:10px;padding:0 7px;font-size:11.5px;line-height:1.6;color:var(--fg);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.st-done{color:var(--accent-fg)}
.sch-t{min-width:1060px}
.sch-t td,.sch-t th{padding:6px 6px;vertical-align:top}
.sch-t td.sticky,.sch-t th.sticky{position:sticky;left:0;background:var(--panel);z-index:1;min-width:170px}
.sch-t th.sticky{background:var(--sunk)}
.sch-t tr.grp td{background:var(--sunk);font-weight:600;font-size:12.5px;color:var(--muted);padding:5px 8px}
.sch-t tr.grp td.sticky{background:var(--sunk)}
.sch-t .cell{display:flex;flex-wrap:wrap;gap:3px;min-height:22px}
.sch-t .cur{box-shadow:inset 0 -2px 0 var(--orange)}
.plan-t tr.subr td{background:var(--sunk)}
.plan-t tr.subr td.sticky{background:var(--sunk);padding-left:18px;font-weight:400}
.plan-t tr.rest td{color:var(--muted);font-size:12.5px}
.plan-t tr.rest td.sticky{padding-left:18px}
.plan-t .neg{color:var(--bad);font-weight:600}
.addsub{width:auto;max-width:120px;font-size:12px;padding:2px 4px;margin-top:4px;display:block}
.xbtn{border:0;background:none;color:var(--muted);padding:0 4px;font-size:14px}
.xbtn:hover{color:var(--bad)}
.picker{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:8px;padding:12px}
.pickrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:4px;background:var(--info-bg);border-radius:14px;padding:2px 2px 2px 10px;font-size:13px}
.pchip small{color:var(--muted);font-size:11.5px}
.pchip.exp{background:var(--orange-soft)}
.pchip.conf{background:var(--bad-bg);color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.pchip button{border:0;background:none;width:22px;height:22px;border-radius:50%;color:var(--muted);font-size:14px;line-height:1}
.pchip button:hover{background:var(--panel);color:var(--bad)}
.subnav button{display:flex;align-items:center;gap:6px}
.subnav .cnt{margin-left:auto;background:var(--orange);color:#1A1205;border-radius:10px;font-size:11px;padding:0 7px;font-weight:700}
.subnav .cnt.mute{background:var(--mute-bg);color:var(--muted)}
.subnav .newbtn{margin:0 2px 8px;justify-content:center;background:var(--accent);color:var(--accent-fg);font-weight:600;padding:9px}
.subnav .newbtn:hover{background:var(--accent);filter:brightness(1.15)}

const hasBat=w=>{const ch=String(w).trim().slice(-1).charCodeAt(0);return ch>=0xAC00&&ch<=0xD7A3?(ch-0xAC00)%28!==0:null};
const josa=(w,a,b)=>{const h=hasBat(w);return w+(h===null?`${a}(${b})`:h?a:b)};
const qj=(w,a,b)=>{const h=hasBat(w);return `‘${w}’${h===null?`${a}(${b})`:h?a:b}`};
function monthOf(p,date){const ys=p?.years||[];const y=ys.find(z=>date>=z.start&&date<=z.end)||curY(p);if(!y)return null;const m=(+date.slice(0,4)*12+ +date.slice(5,7))-(+y.start.slice(0,4)*12+ +y.start.slice(5,7))+1;return{y,m}}
const planRows=(p,no)=>(p.mplan=p.mplan||{})[no]||(p.mplan[no]=[]);
const toks=t=>new Set(String(t||'').replace(/[^가-힣A-Za-z0-9]/g,' ').split(/\s+/).flatMap(w=>w.length<2?[]:Array.from({length:w.length-1},(_,i)=>w.slice(i,i+2))));
const overlap=(a,b)=>{const A=toks(a),B=toks(b);let n=0;A.forEach(x=>B.has(x)&&n++);return n};
const expTitle=x=>['교수','책임연구원','선임연구원','수석연구원','기술이사','시험소장','변리사','연구위원','연구원'].find(k=>String(x.career||'').replace(x.org,'').includes(k))||'위원';
const expIntro=x=>`${x.field} 분야 전문가인 ${x.org} ${x.name} ${expTitle(x)}`;
function monthCtx(c){return null;const mi=monthOf(c.p,c.date);if(!mi)return null;const rows=planRows(c.p,mi.y.no);const now=rows.filter(r=>r.m1<=mi.m&&mi.m<=r.m2);const key=c.topic+' '+c.exp.map(i=>{const x=expert(i);return x?x.field+' '+x.career:''}).join(' ');
  const ranked=now.map(r=>({r,s:overlap(r.task+' '+r.detail,key)})).sort((a,b)=>b.s-a.s).map(x=>x.r);const nm=Math.min(...rows.filter(r=>r.m1>mi.m).map(r=>r.m1));const next=rows.filter(r=>r.m1===nm);
  return{y:mi.y,m:mi.m,main:ranked[0],others:ranked.slice(1),next,nm:isFinite(nm)?nm:null}}
function meetKind(c){if(/착수/.test(c.topic))return '착수 회의';if(c.doc==='자문의견서')return '자문';if(c.exp.length)return '자문회의';return new Set(c.att.map(i=>person(i)?.org)).size>1?'기관 합동 회의':'연구 회의'}

작성 방식:

${b.experts.map(x=>`- ${x.name} ${expTitle(x)} (${x.org}, ${x.field}): ${x.career}`).join('\n')||'- 없음'}

${b.paras.map(x=>`[근거 ${x.n}] (${x.doc.kind}: ${x.doc.name}) ${x.t}`).join('\n')||'- 없음'}`;

function sampleFor(c){
  const b=bundleFor(c.srcs,c.exp);const p=c.p;const mc=monthCtx(c);const kind=meetKind(c);const ex=b.experts;const adv=c.doc==='자문의견서';
  const names=[...c.att.map(i=>person(i)?.name),...c.exp.map(i=>expert(i)?.name+'(전문가)'),...(c.extra||[])].filter(Boolean).join(', ');const when=`${fdate(c.date)}${c.start?` ${c.start}~${c.end}`:''}`;

  const main=mc?.main;const what=main?`${mc.y.no}차년도 ${mc.m}월차 연구내용인 ${qj(main.task,'을','를')}`:`${qj(c.topic,'을','를')}`;

    :`본 회의는 ${what} 추진하기 위해 실시한 ${kind}로서, ${exTxt?`${josa(exTxt,'을','를')} 모시고 ${goal}에 대한 전문적 의견을 수렴하고자 하였음.`:`${orgs.join('·')||'참여'} 연구진이 참석하여 ${goal} 추진 현황을 점검하고 세부 실행 방안을 논의하고자 하였음.`}${mc?.others.length?` 아울러 같은 월차에 진행 중인 ${mc.others.map(r=>`‘${r.task}’`).join(', ')}의 추진 현황도 함께 점검하고자 함.`:''}`;
  const bg=[...b.paras.filter(x=>x.doc.kind!=='회의록').map(x=>({x,s:overlap(x.t,(main?main.task+' '+main.detail:'')+' '+c.topic)})).sort((a,b)=>b.s-a.s).slice(0,2).map(({x})=>`- ${x.t} [근거 ${x.n}]`),...b.paras.filter(x=>x.doc.kind==='회의록').slice(0,1).map(x=>{const L=String(x.doc.body||x.t).split('\n').map(l=>l.trim());const sec=h=>{const i=L.findIndex(l=>l.startsWith(h));if(i<0)return '';const out=[];for(let j=i+1;j<L.length&&L[j];j++)out.push(L[j]);return out.join(' ')};const dec=sec('결정')||sec('논의')||x.t;return `- 이전 회의(${fdate(x.doc.date)}) 후속 사항: ${dec.replace(/\s+/g,' ').slice(0,120)} [근거 ${x.n}]`})].join('\n')||'- [담당자 입력: 지금까지의 추진 현황]';

function suggest(r){
  const v=r.vendor+' '+(r.lines||[]).map(x=>x[0]).join(' ');let item='연구활동비',sub='연구실 운영비',meeting='';
  if(/식당|가든|카페|푸드|정식|식대|도시락/.test(v))sub='회의비';
  else if(/코레일|KTX|SRT|고속|택시|호텔|숙박|항공/.test(v))sub=/항공/.test(v)?'국외 출장여비':'국내여비';
  else if(/랩|케미|시약|용매|바인더|소재|재료|원료/.test(v)){item='연구재료비';sub='구매'}
  else if(/소프트|SW|라이선스/.test(v))sub='소프트웨어활용비';
  else if(/클라우드|AWS|GPU/.test(v))sub='클라우드컴퓨팅서비스 이용료';
  let pr=visible()[0]?.id||'';
  if(sub==='회의비'){const m=S.meetings.find(x=>x.date===r.date&&x.status==='완료'&&!x.entry&&live(proj(x.proj),S.view));if(m){pr=m.proj;meeting=m.id}}
  else{const m=S.meetings.find(x=>Math.abs(new Date(x.date)-new Date(r.date))<864e5*3&&live(proj(x.proj),S.view));if(m)pr=m.proj}
  return{proj:pr,item,sub,meeting};
}

async function htmlPdf(html,opt){
  if(!window.html2canvas||!window.jspdf)throw new Error('lib');
  const stage=document.getElementById('a4stage');stage.innerHTML=html;
  const imgs=[...stage.querySelectorAll('img')];await Promise.all(imgs.map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
  try{await document.fonts?.ready}catch(_){}
  if(opt?.fit)fitA4(stage.firstElementChild);
  const canvas=await html2canvas(stage.firstElementChild,{scale:2,backgroundColor:'#ffffff',logging:false});stage.innerHTML='';
  const pdf=new jspdf.jsPDF({unit:'mm',format:'a4'});const pageH=Math.round(canvas.width*297/210);
  for(let y=0,i=0;y<canvas.height-12;y+=pageH,i++){const c=document.createElement('canvas');c.width=canvas.width;c.height=Math.min(pageH,canvas.height-y);
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(canvas,0,-y);
    if(i)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',.9),'JPEG',0,0,210,210*c.height/c.width)}
  return pdf.output('blob');
}

function unitOrder(o){const root=o.units.find(u=>!u.parent);const out=[];const walk=(n,d)=>{const u=o.units.find(x=>x.name===n);if(!u||out.some(z=>z.u===u))return;out.push({u,d});o.units.filter(x=>x.parent===n).forEach(c=>walk(c.name,d+1))};if(root)walk(root.name,0);o.units.forEach(u=>{if(!out.some(z=>z.u===u))out.push({u,d:1})});return out}
function memberKinds(o){return ukinds(o).filter(k=>o.units.some(u=>u.parent&&unitKind(u)===k))}
function memberKindSel(o,p,k){const path=unitPath(o,p.unit);const r=ukRank(o,k);const cur=path.find(u=>u.parent&&unitKind(u)===k);
  const anc=[...path].reverse().find(u=>!u.parent||ukRank(o,unitKind(u))<r);const opts=o.units.filter(u=>u.parent&&unitKind(u)===k&&(!anc||unitPath(o,u.name).includes(anc)));
  return `<label><span hidden>${esc(p.name)} ${esc(k)}</span><select id="puk-${p.id}-${esc(k)}" data-puk="${p.id}|${esc(k)}" style="min-width:96px"><option value="">—</option>${opts.map(u=>`<option ${cur===u?'selected':''}>${esc(u.name)}</option>`).join('')}</select></label>`}

/* ===== 연구제안 관리 ===== */
const isStudent=x=>/대학원생|학부/.test(x?.role||'');
function propYearsOf(p){if(!p.pyears||!p.pyears.length){const n=Math.max(1,+p.nYears||1);const ys=[];let st=p.start||TODAY;for(let i=0;i<n;i++){const en=i===n-1?p.end:(addYear(st)>p.end?p.end:addYear(st));ys.push({no:i+1,start:st,end:en});st=addDays(en,1);if(st>p.end)break}p.pyears=ys;p.nYears=ys.length}return p.pyears}
function propOf(q,n){const pr=q.prop||(q.prop={});if(!pr.years){const base={G:pr.G||0,share:pr.share||0,cashPct:pr.cashPct||0,ind:pr.ind||0,staff:pr.staff||[],items:pr.items||{}};['G','share','cashPct','ind','staff','items'].forEach(k=>delete pr[k]);pr.years=[base]}
  while(pr.years.length<n)pr.years.push(JSON.parse(JSON.stringify(pr.years[pr.years.length-1])));if(pr.years.length>n)pr.years.length=n;pr.years.forEach(y=>{y.staff=y.staff||[];y.items=y.items||{}});return pr}
const yMonths=py=>Math.max(1,(+py.end.slice(0,4)*12+ +py.end.slice(5,7))-(+py.start.slice(0,4)*12+ +py.start.slice(5,7))+1);
function propTotal(p,org){const n=propYearsOf(p).length;const cs=Array.from({length:n},(_,i)=>propCalc(p,org,i));const lab=c=>sum(c.rows.filter(r=>r.auto==='lab').map(r=>r.c+r.k));
  return{cs,T:sum(cs.map(c=>c.T)),G:sum(cs.map(c=>c.pr.G)),Bc:sum(cs.map(c=>c.Bc)),Bk:sum(cs.map(c=>c.Bk)),cashT:sum(cs.map(c=>c.cashT)),kindT:sum(cs.map(c=>c.kindT)),lab:sum(cs.map(lab)),ok:cs.every(c=>c.ok)}}
function propPayYr(q,i,py){const pr=q.prop||{};const y=pr.years?.[i]||{};const ys=payYears();const y0=+String(py.start||TODAY).slice(0,4);
  const want=+y.payYr||(+pr.payBase?+pr.payBase+i:y0);const how=+y.payYr?'직접':+pr.payBase?'기준연도':'자동';
  if(ys.includes(want))return{yr:want,want,ok:true,how};const lo=ys.filter(v=>v<=want);return{yr:lo.length?Math.max(...lo):Math.min(...ys),want,ok:false,how}}
function allocOf(p,org,i){const v=p.alloc?.[org]?.[i];return v==null?null:typeof v==='object'?v:{G:+v}}
function propCalc(p,org,yi){
  const q=part(p,org);if(!q)return null;const ys=propYearsOf(p);const i=Math.max(0,Math.min(yi??(S.propYr>=0?S.propYr:0),ys.length-1));const py=ys[i];const pr=propOf(q,ys.length).years[i];const al=allocOf(p,org,i);if(al){if(al.G!=null)pr.G=+al.G;if(al.share!=null)pr.share=+al.share;if(al.cashPct!=null)pr.cashPct=+al.cashPct}
  const T=pr.share>=100?0:Math.round(pr.G/(1-pr.share/100)/1000)*1000;const B=Math.max(0,T-pr.G);const Bc=Math.round(B*pr.cashPct/100/1000)*1000;const Bk=B-Bc;
  const pyr=propPayYr(q,i,py);const yr=pyr.yr;

function allocTable(p){const ys=propYearsOf(p);const lead=isLead(p);const os=sortParts(p.parts.filter(x=>x.status==='수락'));let i=alYear(p);if(i<0)i=0;

  <div class="tw"><table style="white-space:nowrap"><thead><tr><th>기관</th><th class="r">정부지원</th><th class="r">기관부담 비율</th><th class="r">현금 비율</th><th class="r">기관부담 현금</th><th class="r">현물</th><th class="r">현금 합계</th><th class="r">총 사업비</th><th>상태</th></tr></thead><tbody>

  ${rows.map(({q,al,c})=>`<tr><td>${esc(S.orgs[q.org].short)} <span class="small muted">${esc(partLabel(q))}</span></td>

    <td class="r">${lead?inp(q.org,'share',al?.share??'',`${S.orgs[q.org].short} 기관부담 비율`,0.5,al?0:c.pr.share)+'%':`<span class="num">${c.pr.share}%</span>`}</td>

    <td class="r num">${eok(c.Bc)}</td><td class="r num">${eok(c.Bk)}</td><td class="r num">${eok(c.cashT)}</td><td class="r num"><b>${eok(c.T)}</b></td><td>${al?'<span class="chip good">배정</span>':'<span class="chip warn">미배정</span>'}</td></tr>`).join('')}</tbody>
  <tfoot><tr><td>연구단 합계</td><td class="r num">${eok(sumG)}</td><td></td><td></td><td class="r num">${eok(sum(rows.map(r=>r.c.Bc)))}</td><td class="r num">${eok(sum(rows.map(r=>r.c.Bk)))}</td><td class="r num">${eok(sum(rows.map(r=>r.c.cashT)))}</td><td class="r num"><b>${eok(sum(rows.map(r=>r.c.T)))}</b></td><td></td></tr></tfoot></table></div>
  ${lead?'<p class="small muted" style="margin:6px 0 0">미배정 기관의 흐린 숫자는 그 기관이 직접 넣은 값이에요. 세 칸 중 하나라도 넣으면 ‘배정’이 되고 그 기관은 재원을 고칠 수 없어요.</p>':''}</section>`}
function budgetStatus(p){const ys=propYearsOf(p);const sel=alYear(p);const os=sortParts(p.parts.filter(x=>x.status==='수락'));
  const rows=os.map(q=>{const cs=sel>=0?[propCalc(p,q.org,sel)]:ys.map((y,i)=>propCalc(p,q.org,i));const f=k=>sum(cs.map(c=>c[k]));return{q,fixed:sel>=0?!!allocOf(p,q.org,sel):ys.some((y,i)=>allocOf(p,q.org,i)),aC:f('cashT'),aK:f('kindT'),C:f('C'),K:f('K')}});
  const left=(a,b)=>{const d=a-b;return `<span class="num ${d<0?'err':d>0?'':'good'}">${d<0?'초과 '+eok(-d):d>0?eok(d):'0'}</span>`};
  return `<section class="card" style="margin-top:14px"><div class="row between" style="flex-wrap:wrap;gap:8px;margin-bottom:8px"><div><h3 class="h3" style="margin:0">기관별 편성 현황</h3><p class="small muted" style="margin:2px 0 0">정해진 재원(배정)과 각 기관이 비목에 넣은 금액(편성)을 비교해요. 남은 금액이 0이 되면 편성 완료예요.</p></div>${alYearSeg(p,true)}</div>

  ${rows.map(r=>{const ok=r.aC===r.C&&r.aK===r.K;const over=r.C>r.aC||r.K>r.aK;return `<tr><td>${esc(S.orgs[r.q.org].short)}${r.q.org===S.view?' <span class="chip">우리 기관</span>':''}${r.fixed?'':' <span class="small muted">· 자체 재원</span>'}</td><td class="r num">${eok(r.aC)}</td><td class="r num">${eok(r.C)}</td><td class="r">${left(r.aC,r.C)}</td><td class="r num">${eok(r.aK)}</td><td class="r num">${eok(r.K)}</td><td class="r">${left(r.aK,r.K)}</td><td>${ok?'<span class="chip good">완료</span>':over?'<span class="chip bad">초과</span>':'<span class="chip warn">작성 중</span>'}</td></tr>`}).join('')}</tbody>
  <tfoot><tr><td>연구단 합계</td>${['aC','C'].map(k=>`<td class="r num">${eok(sum(rows.map(r=>r[k])))}</td>`).join('')}<td class="r">${left(sum(rows.map(r=>r.aC)),sum(rows.map(r=>r.C)))}</td>${['aK','K'].map(k=>`<td class="r num">${eok(sum(rows.map(r=>r[k])))}</td>`).join('')}<td class="r">${left(sum(rows.map(r=>r.aK)),sum(rows.map(r=>r.K)))}</td><td></td></tr></tfoot></table></div></section>`}

const SEAL_RED='#C9301F';
const sealFont=`'Nanum Myeongjo','Noto Serif KR','Batang','AppleMyungjo',serif`;
function sealSvg(text,kind,cls='seal'){
  const t=[...String(text||'').replace(/\s/g,'')];let cells=[];
  if(kind==='org'){const ch=t.slice(0,16);const cols=Math.max(2,Math.ceil(Math.sqrt(ch.length))),rows=Math.ceil(ch.length/cols);const cw=48/cols,rh=48/rows;
    ch.forEach((c,i)=>{const col=Math.floor(i/rows),row=i%rows;cells.push({c,x:56-cw*(col+.5),y:8+rh*(row+.5),fs:Math.min(cw,rh)*.82})});
    return `<svg class="${cls}" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(text)} 직인"><rect x="3" y="3" width="58" height="58" rx="3" fill="none" stroke="${SEAL_RED}" stroke-width="3"/>${cells.map(z=>`<text x="${z.x}" y="${z.y}" font-size="${z.fs.toFixed(1)}" font-family="${sealFont}" font-weight="700" fill="${SEAL_RED}" text-anchor="middle" dominant-baseline="central">${esc(z.c)}</text>`).join('')}</svg>`}
  const nm=t.slice(0,4);let ch=nm.length>=4?nm:nm.length===3?[...nm,'인']:nm.length===2?[...nm,'인']:[...nm,'인'];
  const pos=ch.length===3?[[31,17],[31,31],[17,24]]:ch.length===2?[[24,17],[24,31]]:[[31,17],[31,31],[17,17],[17,31]];
  ch.forEach((c,i)=>cells.push({c,x:pos[i][0],y:pos[i][1]}));
  const frame=kind==='square'?`<rect x="3" y="3" width="42" height="42" rx="4" fill="none" stroke="${SEAL_RED}" stroke-width="2.4"/>`:`<circle cx="24" cy="24" r="21" fill="none" stroke="${SEAL_RED}" stroke-width="2.4"/>`;
  return `<svg class="${cls}" viewBox="0 0 48 48" width="46" height="46" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(text)} 도장"><g transform="rotate(-8 24 24)">${frame}${cells.map(z=>`<text x="${z.x}" y="${z.y}" font-size="12.5" font-family="${sealFont}" font-weight="700" fill="${SEAL_RED}" text-anchor="middle" dominant-baseline="central">${esc(z.c)}</text>`).join('')}</g></svg>`;
}

function npYears(f){const n=Math.min(9,Math.max(1,+f.n_ny||1));const av=f._av||(f._av={});const out=[];
  for(let i=1;i<=n;i++){const ks=i===1?'n_ys':'n_s'+i,ke='n_e'+i;
    if(i>1){const d=out[i-2].end?addDays(out[i-2].end,1):'';if(!f[ks]||f[ks]===av[ks]){f[ks]=d;av[ks]=d}}
    const de=f[ks]?addYear(f[ks]):'';if(!f[ke]||f[ke]===av[ke]){f[ke]=de;av[ke]=de}out.push({no:i,start:f[ks],end:f[ke],ks,ke})}return out}

async function pdfText(file){
  const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  await loadScript(base+'pdf.min.js');await loadScript(base+'pdf.worker.min.js');
  pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';

  for(let i=1;i<=Math.min(doc.numPages,30);i++){const pg=await doc.getPage(i);const tc=await pg.getTextContent();let line='',lines=[],lastY=null;
    tc.items.forEach(it=>{const y=Math.round(it.transform[5]);if(lastY!==null&&Math.abs(y-lastY)>2){lines.push(line);line=''}line+=it.str;lastY=y});lines.push(line);out.push(lines.join('\n'))}

  text.split('\n').forEach(l=>{const t=l.trim();if(!t){if(buf)paras.push(buf),buf='';return}buf+=(buf?' ':'')+t;if(/[.다]$/.test(t)&&buf.length>60){paras.push(buf);buf=''}});if(buf)paras.push(buf);

}
